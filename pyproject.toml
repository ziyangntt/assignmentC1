[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "Streaming application log incident analysis"
requires-python = ">=3.10"

[project.scripts]
logscope = "logscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
